<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RideShareLite</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🚗 RideShareLite</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#create-user">Create User</a>
    <a href="#publish">Publish Ride</a>
    <a href="#search">Find Ride</a>
  </nav>
</header>


<!-- HOME -->

<section id="home" class="hero">

  <div class="hero-content">

    <h1>Share Your Ride.<br>Save Money.</h1>

    <p>
      Find office and college carpool partners
      travelling on the same route.
    </p>

    <a href="#search" class="btn">
      Find a Ride
    </a>

  </div>

</section>


<!-- CREATE USER -->

<section id="create-user" class="container">

  <h2>👤 Create User</h2>

  <div class="card">

    <label>Name</label>

    <input
            type="text"
            id="name"
            placeholder="Enter your name">


    <label>Email</label>

    <input
            type="email"
            id="email"
            placeholder="Enter your email">


    <label>Phone</label>

    <input
            type="text"
            id="phone"
            placeholder="Enter phone number">


    <button type="button" onclick="createUser()">
      Create User
    </button>

    <p id="userMessage"></p>

    <div id="userList" class="user-list"></div>

  </div>

</section>


<!-- PUBLISH RIDE -->

<section id="publish" class="container">

  <h2>🚘 Publish Your Ride</h2>

  <div class="card">

    <label>Driver User ID</label>

    <input
            type="number"
            id="driverId"
            placeholder="Driver ID">


    <label>Origin</label>

    <input
            type="text"
            id="origin"
            placeholder="Origin">


    <label>Destination</label>

    <input
            type="text"
            id="destination"
            placeholder="Destination">


    <label>Departure Time</label>

    <input
            type="datetime-local"
            id="departureTime">


    <label>Available Seats</label>

    <input
            type="number"
            id="seats"
            min="1"
            placeholder="Available seats">


    <button type="button" onclick="publishRide()">
      Publish Ride
    </button>

    <p id="rideMessage"></p>

  </div>

</section>


<!-- SEARCH -->

<section id="search" class="container">

  <h2>🔍 Find a Ride</h2>

  <div class="card">

    <label>Origin</label>

    <input
            type="text"
            id="searchOrigin"
            placeholder="Origin">


    <label>Destination</label>

    <input
            type="text"
            id="searchDestination"
            placeholder="Destination">


    <button type="button" onclick="searchRides()">
      Search Rides
    </button>

  </div>

  <div id="rideResults"></div>

</section>


<!-- FOOTER -->

<footer>

  <p>
    © 2026 RideShareLite | Office & College Carpool
  </p>

</footer>


<!-- JAVASCRIPT -->

<script>

  async function createUser() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!name || !email || !phone) {
      alert("Please fill all fields");
      return;
    }

    const user = { name, email, phone };

    try {
      const response = await fetch("http://localhost:8081/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(user)
      });

      const text = await response.text();

      if (!response.ok) {
        throw new Error(text || "Failed to create user");
      }

      const data = JSON.parse(text);
      const messageBox = document.getElementById("userMessage");
      messageBox.textContent = "User created successfully! ID: " + data.id;

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("phone").value = "";

      await loadUsers();
    } catch (error) {
      console.error(error);
      const messageBox = document.getElementById("userMessage");
      messageBox.textContent = "User creation failed: " + error.message;
    }
  }

  function renderUsers(users) {
    const userList = document.getElementById("userList");
    if (!userList) return;

    if (!users || users.length === 0) {
      userList.innerHTML = "<h3>Created Users</h3><p>No users created yet.</p>";
      return;
    }

    userList.innerHTML = `
      <h3>Created Users</h3>
      <ul>
        ${users.map(user => `
          <li>
            <strong>ID:</strong> ${user.id} |
            <strong>Name:</strong> ${user.name} |
            <strong>Email:</strong> ${user.email} |
            <strong>Phone:</strong> ${user.phone}
          </li>
        `).join("")}
      </ul>
    `;
  }

  async function loadUsers() {
    try {
      const response = await fetch("http://localhost:8081/users");
      if (!response.ok) throw new Error("Unable to load users");

      const users = await response.json();
      renderUsers(users);
    } catch (error) {
      console.error(error);
      const userList = document.getElementById("userList");
      if (userList) {
        userList.innerHTML = "<h3>Created Users</h3><p>Unable to load users.</p>";
      }
    }
  }

  async function publishRide() {
    const driverId = document.getElementById("driverId").value.trim();
    const origin = document.getElementById("origin").value.trim();
    const destination = document.getElementById("destination").value.trim();
    const departureTime = document.getElementById("departureTime").value.trim();
    const seats = document.getElementById("seats").value.trim();

    if (!driverId || !origin || !destination || !departureTime || !seats) {
      alert("Please fill in all ride details.");
      return;
    }

    const ride = {
      origin,
      destination,
      departureTime,
      seatsAvailable: Number(seats),
      driver: { id: Number(driverId) }
    };

    try {
      const response = await fetch("http://localhost:8081/rides", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(ride)
      });

      const text = await response.text();
      if (!response.ok) throw new Error(text || "Failed to publish ride");

      const data = JSON.parse(text);
      document.getElementById("rideMessage").textContent = "Ride published successfully! Ride ID: " + data.id;

      document.getElementById("driverId").value = "";
      document.getElementById("origin").value = "";
      document.getElementById("destination").value = "";
      document.getElementById("departureTime").value = "";
      document.getElementById("seats").value = "";
    } catch (error) {
      console.error(error);
      document.getElementById("rideMessage").textContent = "Ride publishing failed: " + error.message;
    }
  }

  async function searchRides() {
    const origin = document.getElementById("searchOrigin").value.trim();
    const destination = document.getElementById("searchDestination").value.trim();

    if (!origin || !destination) {
      alert("Please enter origin and destination.");
      return;
    }

    try {
      const response = await fetch(`http://localhost:8081/rides/search?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`);
      if (!response.ok) throw new Error("Search request failed");

      const rides = await response.json();
      const resultsContainer = document.getElementById("rideResults");

      if (!rides.length) {
        resultsContainer.innerHTML = "<p>No rides found for the selected route.</p>";
        return;
      }

      resultsContainer.innerHTML = rides.map(ride => `
        <div class="ride-card">
          <h3>Ride ID: ${ride.id}</h3>
          <p><strong>Origin:</strong> ${ride.origin}</p>
          <p><strong>Destination:</strong> ${ride.destination}</p>
          <p><strong>Departure:</strong> ${ride.departureTime}</p>
          <p><strong>Seats:</strong> ${ride.seatsAvailable}</p>
        </div>
      `).join("");
    } catch (error) {
      console.error(error);
      document.getElementById("rideResults").innerHTML = "<p>Unable to search rides right now.</p>";
    }
  }

  document.addEventListener("DOMContentLoaded", loadUsers);

</script>


</body>

</html>
